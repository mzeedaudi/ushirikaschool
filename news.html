<body data-page="news">
<div id="site-header"></div>
<script src="js/site.js"></script>

<main id="main">

  <header class="page-head page-head--photo">
    <div class="wrap">
      <div class="page-head__text">
        <span class="mark" aria-hidden="true"></span>
        <h1>News and events</h1>
        <p class="lede">Prize days, exam results, visits and everyday wins from Ushirika.</p>
      </div>
      <figure class="page-head__photo">
        <img src="assets/gallery/photo-24.jpg"
             srcset="assets/gallery/photo-24-small.jpg 800w, assets/gallery/photo-24.jpg 1600w"
             sizes="(max-width: 860px) 100vw, 560px" width="1600" height="1067" fetchpriority="high"
             style="object-position: 50% 40%" alt="Girls in white shirts and colourful kitenge skirts dance in front of a crowd of students">
      </figure>
    </div>
  </header>

  <section class="section" aria-label="Latest news">
    <div class="wrap">
      <!--
        HOW TO ADD A NEWS POST
        1. Put the photo in assets/news/, for example prize-day-2026.jpg (about 1200px wide)
        2. Copy this block, paste it just below this comment (newest post at the top),
           and change the date, title, photo, alt text and words:

        <article class="post">
          <img src="assets/news/prize-day-2026.jpg" alt="Describe what is in the photo" width="1200" height="800" loading="lazy">
          <div class="prose">
            <time datetime="2026-11-20">20 November 2026</time>
            <h2>Title of the news post</h2>
            <p>Two or three short paragraphs about what happened.</p>
          </div>
        </article>

        3. When the first post is in, delete the whole news-empty block below (the box and its four photos).
      -->

      <div class="news-empty">
        <div class="empty">
          <h2>News is on its way</h2>
          <p>Our first updates will appear here soon. Until then, follow day-to-day life at Ushirika on social media, or get a short email from us each term.</p>
          <div class="btn-row">
            <a class="btn btn--blue" href="https://www.facebook.com/UshirikaChildrenKibera">Follow us on Facebook</a>
            <a class="btn btn--ghost" href="#newsletter-email">Get termly updates</a>
          </div>
        </div>
        <div class="mosaic" role="group" aria-label="Recent moments at Ushirika">
          <figure>
            <img src="assets/gallery/photo-50-small.jpg" srcset="assets/gallery/photo-50-small.jpg 800w, assets/gallery/photo-50.jpg 1600w" sizes="(max-width: 900px) 50vw, 360px" width="800" height="360" loading="lazy"
                 alt="Students in Code Yetu T-shirts and school uniforms stand on stage at Safaricom Decode, Made of Kenya edition">
          </figure>
          <figure>
            <img src="assets/gallery/photo-53-small.jpg" srcset="assets/gallery/photo-53-small.jpg 800w, assets/gallery/photo-53.jpg 1600w" sizes="(max-width: 900px) 50vw, 360px" width="800" height="600" loading="lazy"
                 alt="A student presents a touch-free soap dispenser project at a podium while two classmates stand nearby">
          </figure>
          <figure>
            <img src="assets/gallery/photo-46-small.jpg" srcset="assets/gallery/photo-46-small.jpg 800w, assets/gallery/photo-46.jpg 1600w" sizes="(max-width: 900px) 50vw, 360px" width="800" height="600" loading="lazy"
                 alt="Ushirika scouts in khaki uniforms, green berets and yellow scarves march across the school courtyard">
          </figure>
          <figure>
            <img src="assets/gallery/photo-47-small.jpg" srcset="assets/gallery/photo-47-small.jpg 800w, assets/gallery/photo-47.jpg 1600w" sizes="(max-width: 900px) 50vw, 360px" width="800" height="451" loading="lazy"
                 alt="Students in school uniform sit in a modern auditorium during a learning visit">
          </figure>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
</body>
