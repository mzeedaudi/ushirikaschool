<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us | Ushirika School Kibera</title>
  <meta name="description" content="Call or WhatsApp Ushirika School on 0721 556 239, email info@ushirikaschool.com, or visit us in Laini Saba, Kibera, Nairobi.">
  <link rel="canonical" href="https://ushirikaschool.com/contact.html">
  <meta property="og:url" content="https://ushirikaschool.com/contact.html">
  <meta property="og:site_name" content="Ushirika School Kibera">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact Ushirika School Kibera">
  <meta property="og:description" content="Call or WhatsApp 0721 556 239, or visit us in Laini Saba, Kibera.">
  <meta property="og:image" content="https://ushirikaschool.com/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0F2D4A">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<script src="js/site.js"></script>

<main id="main">

  <header class="page-head page-head--photo">
    <div class="wrap">
      <div class="page-head__text">
        <span class="mark" aria-hidden="true"></span>
        <h1>Contact us</h1>
        <p class="lede">Questions about sponsoring, partnering, visiting or a place for your child? Call, WhatsApp or send us a message.</p>
      </div>
      <figure class="page-head__photo">
        <img src="assets/gallery/photo-28.jpg"
             srcset="assets/gallery/photo-28-small.jpg 800w, assets/gallery/photo-28.jpg 1600w"
             sizes="(max-width: 860px) 100vw, 560px" width="1600" height="1067" fetchpriority="high"
             style="object-position: 50% 50%" alt="A three-storey building painted bright blue, with balconies and railings, under a clear sky">
      </figure>
    </div>
  </header>

  <section class="section" aria-label="Contact details and message form">
    <div class="wrap contact-grid">
      <div>
        <ul class="contact-list">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 6.8 6.8l1.4-2.2 4.3 1.7V19a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2Z"/></svg>
            <div><span>Call</span><a href="tel:+254721556239">0721 556 239</a></div>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.2-4A8.5 8.5 0 1 1 8.4 19L4 20Z"/><path d="M9 8.5c0 3.6 2.9 6.5 6.5 6.5l1-1.6-2-1-1 .8a4.6 4.6 0 0 1-2.2-2.2l.8-1-1-2L9.5 8.5Z" stroke-width="1.4"/></svg>
            <div><span>WhatsApp</span><a href="https://wa.me/254721556239">0721 556 239</a></div>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>
            <div><span>Email</span><a href="mailto:info@ushirikaschool.com">info@ushirikaschool.com</a></div>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <div><span>Visit</span><strong>Laini Saba, Kibera, Nairobi</strong></div>
          </li>
        </ul>
        <a class="btn btn--ghost" href="https://www.google.com/maps/dir/?api=1&amp;destination=-1.3122093,36.7940074">Get directions</a>
      </div>

      <div class="form-card">
        <h2 style="font-size:2rem">Send a message</h2>
        <form class="js-form" data-success="Message sent. We'll reply to your email soon.">
          <input type="hidden" name="_subject" value="New message from the website">
          <input type="hidden" name="form" value="Contact message">
          <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="field-row">
            <div class="field">
              <label for="c-name">Your name</label>
              <input id="c-name" name="name" type="text" required autocomplete="name">
            </div>
            <div class="field">
              <label for="c-email">Email</label>
              <input id="c-email" name="email" type="email" required autocomplete="email">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="c-phone">Phone or WhatsApp <span class="hint">(optional)</span></label>
              <input id="c-phone" name="phone" type="tel" autocomplete="tel">
            </div>
            <div class="field">
              <label for="c-topic">What's it about?</label>
              <select id="c-topic" name="topic">
                <option>General question</option>
                <option>Sponsoring a child</option>
                <option>Partnering with Ushirika</option>
                <option>Visiting the school</option>
                <option>A place for my child</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="c-message">Message</label>
            <textarea id="c-message" name="message" required></textarea>
          </div>
          <button class="btn btn--red" type="submit">Send message</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <section class="section section--tight" style="padding-top:0" aria-label="Map">
    <div class="wrap">
      <iframe class="map" title="Map showing Ushirika School in Laini Saba, Kibera"
              src="https://maps.google.com/maps?q=-1.3122093,36.7940074&amp;z=16&amp;output=embed"
              loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
  </section>

</main>

<div id="site-footer"></div>
</body>
</html>
